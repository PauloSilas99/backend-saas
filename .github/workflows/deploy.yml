name: Deploy para a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g npm@11
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  publicar:
    name: Publicar na VPS
    needs: verificar
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Preparar acesso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Atualizar o código e subir a imagem
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DIRETORIO: /home/deploy/apps/saas-pgr-api
        run: |
          ssh -i ~/.ssh/id_deploy "$ALVO" bash -eu <<EOF
            cd "$DIRETORIO"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml up -d api
          EOF

      - name: Confirmar que a API respondeu
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$ALVO" bash -eu <<'EOF'
            for tentativa in $(seq 1 30); do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3340/api/v1/health || true)
              if [ "$codigo" = "200" ]; then
                echo "API no ar na tentativa $tentativa"
                exit 0
              fi
              sleep 4
            done
            echo "A API não respondeu 200 em dois minutos. Últimas linhas do container:"
            docker logs --tail 40 saas-pgr-api
            exit 1
          EOF
