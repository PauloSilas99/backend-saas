services:
  api:
    build: .
    ports:
      - '3333:3333'
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  uploads_data:
